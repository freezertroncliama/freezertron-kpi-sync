name: Sincronizar KPI de Manutenção

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kpi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Sem isso, cada execução reprocessaria os ~400 PDFs do zero (o
      # runner é descartado a cada vez). Guarda o cache de etags entre
      # execuções pra só reprocessar arquivo novo/alterado.
      - name: Restaurar cache de PDFs já processados
        uses: actions/cache@v4
        with:
          path: cache_pdfs.json
          key: kpi-cache-${{ github.run_id }}
          restore-keys: |
            kpi-cache-

      - name: Rodar sincronização
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Processa em lotes de 150 arquivo novo/alterado por execução —
          # só publica no Supabase quando a lista inteira já foi vista
          # (pode levar 2-3 execuções na primeira vez; depois disso, os
          # lotes de 5 em 5 min normalmente têm poucas novidades e sempre
          # completam de primeira).
          KPI_MAX_NOVOS_POR_EXECUCAO: "150"
        run: python kpi_manutencao.py
