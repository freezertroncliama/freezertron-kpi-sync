name: Sincronizar KPI de Manutenção

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kpi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Sem isso, cada execução reprocessaria os ~400+ PDFs do zero (o
      # runner é descartado a cada vez). Guarda o cache de etags entre
      # execuções pra só reprocessar arquivo novo/alterado — um arquivo
      # por cliente (cache_pdfs_mangels.json, cache_pdfs_noel.json).
      - name: Restaurar cache de PDFs já processados
        uses: actions/cache@v4
        with:
          path: |
            cache_pdfs_mangels.json
            cache_pdfs_noel.json
          key: kpi-cache-${{ github.run_id }}
          restore-keys: |
            kpi-cache-

      - name: Rodar sincronização
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Sem isso, o Python usa buffer de bloco (não de linha) fora de um
          # terminal — os prints ficam presos e só aparecem de uma vez no
          # final, dando a impressão de que travou.
          PYTHONUNBUFFERED: "1"
        run: python -u kpi_manutencao.py
